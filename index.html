<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="portrait">
    <title>🪟 Konteksta logs</title>

    <!-- PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/brand-mark.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/brand-mark.png">
    <link rel="apple-touch-icon" href="icons/brand-mark.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Konteksta logs">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Loading / Opening Animation -->
        <div class="window-loader" id="windowLoader">
            <div class="window-frame">
                <div class="window-titlebar">
                    <div class="window-dots">
                        <span class="dot-red"></span>
                        <span class="dot-yellow"></span>
                        <span class="dot-green"></span>
                    </div>
                    <span class="window-label">konteksta logs</span>
                </div>
                <div class="window-body">
                    <div class="window-spinner"></div>
                    <p>Atveras...</p>
                </div>
            </div>
        </div>

        <!-- Header — full-bleed hero image (natural height, faded edges) -->
        <header class="header">
            <div class="header-hero">
                <img class="header-hero-img"
                     src="icons/banner-hero.png"
                     alt="Konteksta logs — Tavas dzīves logi vienā mirklī"
                     width="1586"
                     height="949"
                     decoding="async"
                     fetchpriority="high">
            </div>

            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text"
                       id="searchInput"
                       class="search-input"
                       placeholder="🔍 Meklēt visos konteksta logos..."
                       autocomplete="off">
                <div class="search-results" id="searchResults" style="display:none"></div>
            </div>
        </header>
