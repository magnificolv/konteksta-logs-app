<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>Icon Pack Preview — Konteksta Logs v1.6.1</title>
<style>

  p { color:#94a3b8; margin:0 0 20px; }

</style>
</head>
<body>

</html>
